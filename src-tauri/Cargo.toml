[workspace]
members = ["crates/core"]
resolver = "2"

[package]
name = "game-manage-center"
version = "0.5.0"
description = "Game Manage Center - centralize, back up and restore your game saves"
authors = ["LinkJudge"]
license = "GPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "game_manage_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gm-core = { path = "crates/core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
notify = "7"
sysinfo = "0.30"
chrono = "0.4"
reqwest = { version = "0.12", features = ["blocking"] }
tokio = { version = "1", features = ["time", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "ico"] }
urlencoding = "2"

[target.'cfg(windows)'.dependencies]
windows-icons = "0.4"
# 读 HKCU 里的系统代理设置：reqwest 只认环境变量，不读 Windows 的代理配置
winreg = "0.55"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
