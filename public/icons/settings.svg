<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <defs>
          <filter id="drop-set" x="-15%" y="-15%" width="130%" height="130%">
            <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
          </filter>
          <linearGradient id="bgSettings" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#131B2E"/>
            <stop offset="50%" stop-color="#1A2640"/>
            <stop offset="100%" stop-color="#0A0E18"/>
          </linearGradient>
          <linearGradient id="gearBody" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="100%" stop-color="#2563EB"/>
          </linearGradient>
        </defs>

        <!-- 统一圆角底板 -->
        <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#bgSettings)" stroke="#2B426B" stroke-width="6"/>

        <g filter="url(#drop-set)" transform="translate(256, 256)">
          <!-- 外发光描边底层 (使6个齿与轮盘外缘形成无内部接缝的统一描边) -->
          <g fill="#7DD3FC" stroke="#7DD3FC" stroke-width="10" stroke-linejoin="round">
            <rect x="-40" y="-152" width="80" height="304" rx="26"/>
            <rect x="-40" y="-152" width="80" height="304" rx="26" transform="rotate(60)"/>
            <rect x="-40" y="-152" width="80" height="304" rx="26" transform="rotate(120)"/>
            <circle cx="0" cy="0" r="118"/>
          </g>

          <!-- 一体式无接缝六齿渐变主体 -->
          <g fill="url(#gearBody)">
            <rect x="-40" y="-152" width="80" height="304" rx="26"/>
            <rect x="-40" y="-152" width="80" height="304" rx="26" transform="rotate(60)"/>
            <rect x="-40" y="-152" width="80" height="304" rx="26" transform="rotate(120)"/>
            <circle cx="0" cy="0" r="118"/>
          </g>

          <!-- 中心极简深色轴承孔 + 高亮内环 -->
          <circle cx="0" cy="0" r="58" fill="#0F172A" stroke="#E0F2FE" stroke-width="12"/>
        </g>
      </svg>
