<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <defs>
          <filter id="drop-abt" x="-15%" y="-15%" width="130%" height="130%">
            <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
          </filter>
          <linearGradient id="bgAbout" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#14142B"/>
            <stop offset="50%" stop-color="#1C1C3C"/>
            <stop offset="100%" stop-color="#0B0B18"/>
          </linearGradient>
          <linearGradient id="circleBody" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="50%" stop-color="#6366F1"/>
            <stop offset="100%" stop-color="#8B5CF6"/>
          </linearGradient>
          <linearGradient id="markGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#E0F2FE"/>
          </linearGradient>
        </defs>

        <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#bgAbout)" stroke="#383870" stroke-width="6"/>

        <g filter="url(#drop-abt)">
          <circle cx="256" cy="256" r="146" fill="url(#circleBody)" stroke="#A5B4FC" stroke-width="5"/>
          <circle cx="256" cy="256" r="106" fill="#0F172A" opacity="0.9"/>

          <!-- 默认：感叹号 (!) -->
          <g id="about-mark-excl">
            <rect x="238" y="176" width="36" height="96" rx="18" fill="url(#markGrad)"/>
            <circle cx="256" cy="314" r="19" fill="#38BDF8"/>
          </g>

          <!-- 备选：信息符 (i) -->
          <g id="about-mark-info" style="display:none;">
            <circle cx="256" cy="192" r="19" fill="#38BDF8"/>
            <rect x="238" y="232" width="36" height="96" rx="18" fill="url(#markGrad)"/>
          </g>
        </g>
      </svg>
